<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Studio</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280;
    --border: #e3e6eb; --accent: #2f6fed; --accent-soft: #e8efff; --danger: #d64545; --ok: #1f8a3c; --ok-soft: #e3f6e8;
    --warn: #b7791f; --warn-soft: #fff4dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1c2027; --text: #e6e8ec; --muted: #9aa3b0;
      --border: #2c323c; --accent: #5b8cff; --accent-soft: #23304d; --danger: #f06a6a; --ok: #4cc272; --ok-soft: #173322;
      --warn: #e0b04a; --warn-soft: #3a3110;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 12px 0 0; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; width: 100%; }
  textarea { resize: vertical; min-height: 70px; }
  button { border: 1px solid var(--border); background: var(--panel); border-radius: 7px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.danger { color: var(--danger); }
  button.small { padding: 3px 10px; font-size: 12px; }
  header input { width: 240px; } header select { width: auto; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }

  .pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 16px 20px 0; }
  .stage-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .stage-card.active { border-color: var(--accent); background: var(--accent-soft); }
  .stage-card .label { color: var(--muted); font-size: 12px; }
  .stage-card .count { font-size: 20px; font-weight: 600; }
  .stage-card .val { color: var(--muted); font-size: 12px; }

  main { padding: 16px 20px 40px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: var(--accent-soft); } tbody tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .pill.review { background: var(--warn-soft); color: var(--warn); }
  .pill.scheduled, .pill.approved { background: var(--ok-soft); color: var(--ok); }
  .pill.failed { background: #fbe6e6; color: var(--danger); }
  .pill.draft { background: var(--bg); color: var(--muted); }
  .plat { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; color: #fff; margin: 0 3px 3px 0; line-height: 18px; }
  .p-x { background: #111; } .p-linkedin { background: #0a66c2; } .p-instagram { background: #c13584; } .p-threads { background: #444; }
  .p-bluesky { background: #1185fe; } .p-mastodon { background: #6364ff; } .p-facebook { background: #1877f2; }
  .empty { text-align: center; color: var(--muted); padding: 40px; }
  .muted { color: var(--muted); } .sub { font-size: 12px; color: var(--muted); }
  .calview .campaigns, .listview .cal, .listview .calhead { display: none; }

  .calhead { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px; min-height: 150px; display: flex; flex-direction: column; gap: 5px; }
  .day.today { border-color: var(--accent); }
  .day .d { font-size: 12px; color: var(--muted); }
  .day.today .d { color: var(--accent); font-weight: 600; }
  .ev { font-size: 12px; border-radius: 6px; padding: 4px 6px; cursor: pointer; border: 1px solid var(--border); background: var(--bg); }
  .ev.approved { border-color: var(--ok); background: var(--ok-soft); }
  .ev.draft { border-style: dashed; }
  .ev .t { color: var(--muted); }
  .ev .x { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.3); display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100%); background: var(--panel); border-left: 1px solid var(--border); display: none; flex-direction: column; }
  .open .drawer { display: flex; } .open .drawer-bg { display: block; }
  .drawer.narrow { width: min(540px, 100%); }
  .drawer .head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 8px; }
  .drawer .head h2 { margin: 0; font-size: 18px; }
  .drawer .body { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .drawer .foot { border-top: 1px solid var(--border); padding: 12px 20px 16px; display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .field { margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; } .checks label { display: flex; gap: 5px; align-items: center; color: var(--text); font-size: 13px; margin: 0; }
  .checks input { width: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip { font-size: 12px; padding: 4px 10px; border-radius: 99px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 20px; }
  .tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 10px; color: var(--muted); }
  .tabs button.on { border-bottom-color: var(--accent); color: var(--text); }

  .post { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; display: grid; gap: 7px; }
  .post.approved { border-color: var(--ok); }
  .post textarea { min-height: 110px; }
  .post .count { font-size: 12px; color: var(--muted); } .post .count.over { color: var(--danger); font-weight: 600; }
  .post .meta { font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
  .post .meta a { color: var(--accent); word-break: break-all; }
  .post input[type=datetime-local] { width: auto; }
  .doc { font-size: 14px; line-height: 1.6; } .doc h1 { font-size: 18px; } .doc h2 { font-size: 15px; } .doc a { color: var(--accent); }
  .working { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; margin-bottom: 14px; }
  .steps { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .steps code { font-size: 11px; background: var(--panel); padding: 1px 4px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
  .run { border-top: 1px solid var(--border); padding: 10px 0; }
  .note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .err { color: var(--danger); }
  @media (max-width: 760px) { .pipeline { grid-template-columns: repeat(3, 1fr); } .hide-sm { display: none; } header input { width: 100%; }
    .cal { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body class="listview">
<header>
  <h1>📣 Social Studio</h1>
  <input id="search" placeholder="Search campaigns and posts…">
  <select id="platFilter"><option value="">All platforms</option></select>
  <span class="seg"><button id="listBtn" class="on">Campaigns</button><button id="calBtn">Calendar</button></span>
  <span class="spacer"></span>
  <button id="brandBtn">Brand</button>
  <button class="primary" id="newBtn">+ Campaign</button>
</header>

<section class="pipeline" id="pipeline"></section>

<main>
  <table class="campaigns">
    <thead><tr><th>Campaign</th><th>Platforms</th><th>Posts approved</th><th>Status</th><th class="hide-sm">Day 1</th><th class="hide-sm">Updated</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="calhead"><button class="small" id="prevWk">←</button><button class="small" id="todayWk">This week</button><button class="small" id="nextWk">→</button>
    <span class="sub" id="calRange"></span><span class="spacer"></span><span class="sub">Solid: approved and scheduled · dashed: draft</span></div>
  <div class="cal" id="cal"></div>
</main>

<div id="newWrap">
  <div class="drawer-bg"></div>
  <aside class="drawer narrow">
    <div class="head"><h2 style="flex:1">New campaign</h2><button class="closeBtn">Close</button></div>
    <div class="body">
      <div class="field"><label>Campaign</label><input id="nTitle" placeholder="e.g. Saturday kitchen design open house"></div>
      <div class="field"><label>The content to promote: a page to read (URL), or paste the text</label>
        <textarea id="nSource" style="min-height:120px" placeholder="https://… or the announcement, article or newsletter text"></textarea></div>
      <div class="field"><label>Link every post points to (canonical URL)</label><input id="nLink" placeholder="https://showroom.example/…"></div>
      <div class="grid">
        <div class="field"><label>Goal</label><input id="nGoal" placeholder="e.g. RSVPs for Saturday"></div>
        <div class="field"><label>Audience</label><input id="nAudience" placeholder="e.g. Austin homeowners planning a remodel"></div>
      </div>
      <div class="field"><label>Platforms</label><div class="checks" id="nPlatforms"></div></div>
      <div class="field" style="max-width:220px"><label>Day 1</label><input id="nLaunch" type="date"></div>
      <label>Or start from one of these</label>
      <div class="chips" id="nExamples"></div>
    </div>
    <div class="foot"><div class="row"><span class="sub">The agent reads the content, writes a post per platform, and plans when each goes out.
      Nothing is posted: you approve each post here.</span><span class="spacer"></span><button class="primary" id="createBtn">Draft the campaign</button></div></div>
  </aside>
</div>

<div id="brandWrap">
  <div class="drawer-bg"></div>
  <aside class="drawer narrow">
    <div class="head"><h2 style="flex:1">Brand</h2><button class="closeBtn">Close</button></div>
    <div class="body">
      <div class="field"><label>Name</label><input id="bName"></div>
      <div class="field"><label>Website</label><input id="bSite"></div>
      <div class="field"><label>Voice: how the brand sounds, and what it never says</label><textarea id="bVoice" style="min-height:120px"></textarea></div>
      <div class="field"><label>Time zone for the schedule</label><input id="bTz" placeholder="America/Chicago"></div>
      <div class="sub" id="bAgent"></div>
    </div>
    <div class="foot"><div class="row"><span class="spacer"></span><button class="primary" id="saveBrandBtn">Save</button></div></div>
  </aside>
</div>

<div id="campWrap">
  <div class="drawer-bg"></div>
  <aside class="drawer">
    <div class="head"><div style="flex:1"><h2 id="cHead"></h2><div class="sub" id="cMeta"></div></div><button class="closeBtn">Close</button></div>
    <div class="tabs" id="cTabs"></div>
    <div class="body" id="cBody"></div>
    <div class="foot" id="cFoot"></div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); for (const k of kids) e.append(k); return e; };
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
const STATUS_LABEL = { drafting: "Drafting", review: "In review", revising: "Revising", scheduled: "Scheduled", failed: "Failed" };
let META, camps = [], statusFilter = "", view = "list", open = null, tab = "posts", timer = null, weekOffset = 0;
const ago = t => { const s = Date.now() / 1000 - t; return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : new Date(t * 1000).toLocaleDateString(); };
const fmtSecs = s => s < 60 ? `${Math.round(s)}s` : `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
const plat = k => el("span", { className: "plat p-" + k, textContent: META.platforms[k]?.label || k });
const busy = c => ["drafting", "revising"].includes(c.status);
const whenText = at => at ? new Date(at).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "no time set";

async function load() { camps = await api("GET", "/api/campaigns"); render(); }

function filtered() {
  const q = $("#search").value.trim().toLowerCase(), pf = $("#platFilter").value;
  return camps.filter(c => (!statusFilter || c.status === statusFilter) && (!pf || c.platforms.includes(pf)) &&
    (!q || [c.title, c.source, c.goal, ...c.posts.map(p => p.text)].join(" ").toLowerCase().includes(q)));
}

function render() {
  const week = postsBetween(0, 7);
  const cards = [["drafting", "Drafting"], ["review", "In review"], ["revising", "Revising"], ["scheduled", "Scheduled"]].map(([st, label]) => {
    const n = camps.filter(c => c.status === st);
    const card = el("div", { className: "stage-card" + (statusFilter === st ? " active" : "") }, el("div", { className: "label", textContent: label }),
      el("div", { className: "count", textContent: n.length }),
      el("div", { className: "val", textContent: st === "review" ? `${n.reduce((a, c) => a + c.posts.length - c.approved, 0)} posts to approve` : `${n.reduce((a, c) => a + c.posts.length, 0)} posts` }));
    card.onclick = () => { statusFilter = statusFilter === st ? "" : st; render(); };
    return card;
  });
  cards.push(el("div", { className: "stage-card", onclick: () => setView("calendar") }, el("div", { className: "label", textContent: "Next 7 days" }),
    el("div", { className: "count", textContent: week.filter(x => x.p.status === "approved").length }),
    el("div", { className: "val", textContent: `scheduled · ${week.filter(x => x.p.status !== "approved").length} drafts` })));
  $("#pipeline").replaceChildren(...cards);
  if (view === "calendar") return renderCal();
  const list = filtered();
  $("#rows").replaceChildren(...(list.length ? list.map(c => {
    const tr = el("tr", {},
      el("td", {}, el("div", { textContent: c.title }), el("div", { className: "sub", textContent: (c.link || c.source).slice(0, 90) })),
      el("td", {}, ...c.platforms.map(plat)),
      el("td", { className: c.posts.length && c.approved === c.posts.length ? "" : "muted", textContent: c.posts.length ? `${c.approved} / ${c.posts.length}` : "" }),
      el("td", {}, el("span", { className: "pill " + c.status, textContent: STATUS_LABEL[c.status] || c.status })),
      el("td", { className: "hide-sm muted", textContent: new Date(c.launch + "T12:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }) }),
      el("td", { className: "hide-sm muted", textContent: ago(c.updated_at) }));
    tr.onclick = () => openCamp(c.id);
    return tr;
  }) : [el("tr", {}, el("td", { colSpan: 6, className: "empty", textContent: camps.length ? "No campaigns match." : "No campaigns yet. Start one with “+ Campaign”." }))]));
}

function postsBetween(fromDays, toDays, base) {
  const start = new Date((base || META.today) + "T00:00"); start.setDate(start.getDate() + fromDays);
  const end = new Date(start); end.setDate(end.getDate() + (toDays - fromDays));
  const pf = $("#platFilter").value, out = [];
  for (const c of camps) for (const p of c.posts) {
    if (!p.at || (pf && p.platform !== pf)) continue;
    const t = new Date(p.at);
    if (t >= start && t < end) out.push({ c, p, t });
  }
  return out.sort((a, b) => a.t - b.t);
}

function renderCal() {
  const base = new Date(META.today + "T12:00"); base.setDate(base.getDate() - ((base.getDay() + 6) % 7) + weekOffset * 7);
  const days = [...Array(14)].map((_, i) => { const d = new Date(base); d.setDate(d.getDate() + i); return d.toLocaleDateString("en-CA"); });
  $("#calRange").textContent = `${new Date(days[0] + "T12:00").toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${new Date(days[13] + "T12:00").toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
  const items = postsBetween(0, 14, days[0]);
  $("#cal").replaceChildren(...days.map(d => el("div", { className: "day" + (d === META.today ? " today" : "") },
    el("div", { className: "d", textContent: new Date(d + "T12:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) }),
    ...items.filter(x => x.p.at.slice(0, 10) === d).map(({ c, p, t }) => {
      const ev = el("div", { className: "ev " + p.status, title: `${c.title}\n\n${p.text}` },
        el("div", {}, plat(p.platform), el("span", { className: "t", textContent: t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) })),
        el("div", { className: "x", textContent: p.text }));
      ev.onclick = () => openCamp(c.id);
      return ev;
    }))));
}

function setView(v) {
  view = v; document.body.className = v === "calendar" ? "calview" : "listview";
  $("#listBtn").classList.toggle("on", v === "list"); $("#calBtn").classList.toggle("on", v === "calendar");
  render();
}

// ── new campaign ──
const EXAMPLES = [
  { title: "Saturday kitchen design open house", link: "https://showroom.example/events/kitchen-open-house", goal: "RSVPs for Saturday",
    audience: "Austin homeowners thinking about a kitchen remodel", platforms: ["instagram", "facebook", "x", "linkedin"],
    source: "Kitchen Design Open House at the Showroom, this Saturday from 10 a.m. to 3 p.m., 1100 Congress Ave, Austin.\n\nWalk through our three full kitchen displays (modern oak, classic white shaker and a small-space galley), bring your measurements or a photo of your kitchen, and sit down for a free 20-minute session with one of our designers. We'll have cabinet door, countertop and flooring samples you can take home, coffee and kolaches from the bakery next door, and a kids' corner.\n\nNo sales pitch and no appointment needed; RSVP on our site so we have enough designers on hand. Free parking in the garage on 11th Street." },
  { title: "5 questions to ask before a kitchen remodel", link: "https://showroom.example/blog/5-questions-before-a-kitchen-remodel", goal: "Readers for the article, and consult requests",
    audience: "Homeowners early in planning a remodel", platforms: ["linkedin", "x", "threads", "bluesky", "mastodon", "facebook"],
    source: "5 questions to ask before a kitchen remodel\n\n1. What isn't working today? Write down the three things that annoy you most about your kitchen. Storage, light and counter space come up more than anything else, and they shape the layout more than finishes do.\n2. Are you keeping the layout? Moving a sink or range means moving plumbing, gas or venting, and that is where budgets grow. Keeping the footprint usually saves 20 to 30 percent.\n3. What's your real budget, contingency included? Set aside 10 to 15 percent for what you find behind the walls, especially in homes built before 1980.\n4. How long can you live without a kitchen? Most remodels take 6 to 12 weeks once work starts; custom cabinets add lead time before that. Plan a temporary kitchen.\n5. Who pulls the permits? In Austin, moving walls, plumbing or electrical needs a permit. Ask every contractor who handles it and whether it's in the quote.\n\nOur designers do free 20-minute consults at the showroom on Congress Ave, or at your home." },
];

function newCampaign(preset) {
  const x = preset || {};
  $("#nTitle").value = x.title || ""; $("#nSource").value = x.source || ""; $("#nLink").value = x.link || "";
  $("#nGoal").value = x.goal || ""; $("#nAudience").value = x.audience || "";
  const tomorrow = new Date(META.today + "T12:00"); tomorrow.setDate(tomorrow.getDate() + 1);
  $("#nLaunch").value = tomorrow.toLocaleDateString("en-CA");
  const chosen = x.platforms || ["x", "linkedin", "instagram", "facebook"];
  $("#nPlatforms").querySelectorAll("input").forEach(b => b.checked = chosen.includes(b.value));
  $("#newWrap").classList.add("open");
}
async function createCampaign() {
  const btn = $("#createBtn"); btn.disabled = true;
  try {
    const c = await api("POST", "/api/campaigns", { title: $("#nTitle").value, source: $("#nSource").value, link: $("#nLink").value,
      goal: $("#nGoal").value, audience: $("#nAudience").value, launch: $("#nLaunch").value,
      platforms: [...$("#nPlatforms").querySelectorAll("input:checked")].map(b => b.value) });
    closePanels(); await load(); openCamp(c.id);
  } catch (e) { alert(e.message); }
  btn.disabled = false;
}

// ── brand ──
async function openBrand() {
  META = await api("GET", "/api/meta");
  $("#bName").value = META.brand.brand_name; $("#bSite").value = META.brand.brand_site; $("#bVoice").value = META.brand.brand_voice; $("#bTz").value = META.brand.timezone;
  $("#bAgent").textContent = `The agent is the harness ${META.model} on ${META.api}. Every campaign request carries this brand and voice.`;
  $("#brandWrap").classList.add("open");
}
async function saveBrand() {
  try { await api("PUT", "/api/brand", { brand_name: $("#bName").value, brand_site: $("#bSite").value, brand_voice: $("#bVoice").value, timezone: $("#bTz").value }); closePanels(); META = await api("GET", "/api/meta"); }
  catch (e) { alert(e.message); }
}

// ── a campaign ──
function closePanels() { document.querySelectorAll(".open").forEach(e => e.classList.remove("open")); open = null; clearTimeout(timer); }

async function openCamp(id) {
  clearTimeout(timer);
  if (!open || open.id !== id) tab = "posts";
  const was = open && open.id === id ? open.status : null;
  open = await api("GET", `/api/campaigns/${id}`);
  $("#campWrap").classList.add("open");
  if (was !== open.status || busy(open) || !document.activeElement || !$("#cBody").contains(document.activeElement)) drawCamp();
  if (busy(open)) timer = setTimeout(() => open && open.id === id && openCamp(id), 3000);
  load();
}

function stepList(steps) {
  return el("div", { className: "steps" }, ...steps.slice(-10).map(s => el("div", {}, `${s.kind} `, el("code", { textContent: s.text.slice(0, 200) }))));
}

function postCard(c, p) {
  const limit = META.platforms[p.platform]?.limit || 0;
  const text = el("textarea", { value: p.text });
  const count = el("span", { className: "count" });
  const upd = () => { const n = [...text.value].length; count.textContent = `${n}${limit ? ` / ${limit}` : ""} characters`; count.classList.toggle("over", !!limit && n > limit); };
  text.oninput = upd; upd();
  const at = el("input", { type: "datetime-local", value: p.at || "" });
  const save = el("button", { className: "small", textContent: "Save edits" });
  save.onclick = async () => { open = await api("PUT", `/api/posts/${p.id}`, { text: text.value, at: at.value }); drawCamp(); load(); };
  const approve = el("button", { className: "small " + (p.status === "approved" ? "" : "ok"), textContent: p.status === "approved" ? "Unapprove" : "Approve & schedule" });
  approve.onclick = async () => {
    try { open = await api("PUT", `/api/posts/${p.id}`, { text: text.value, at: at.value, status: p.status === "approved" ? "draft" : "approved" }); drawCamp(); load(); }
    catch (e) { alert(e.message); }
  };
  const ask = el("button", { className: "small", textContent: "Ask the agent to revise" });
  ask.onclick = async () => {
    const note = prompt(`What should change in the ${META.platforms[p.platform].label} post?`, "Give me a stronger first line.");
    if (!note) return;
    try { await api("POST", `/api/campaigns/${c.id}/revise`, { note, platform: p.platform }); openCamp(c.id); } catch (e) { alert(e.message); }
  };
  const meta = el("div", { className: "meta" });
  if (p.hashtags.length) meta.append(el("div", { textContent: "Hashtags: " + p.hashtags.join(" ") }));
  if (p.link) meta.append(el("div", {}, "Link: ", el("a", { href: p.link, target: "_blank", rel: "noopener", textContent: p.link })));
  if (p.alt_text) meta.append(el("div", { textContent: "Image alt text: " + p.alt_text }));
  if (p.cross_links.length) meta.append(el("div", { textContent: "Cross-links: " + p.cross_links.join(", ") }));
  if (p.notes) meta.append(el("div", { textContent: "Agent's note: " + p.notes }));
  return el("div", { className: "post " + p.status },
    el("div", { className: "row" }, plat(p.platform), el("span", { className: "pill " + p.status, textContent: p.status === "approved" ? "approved" : "draft" }),
      el("span", { className: "sub", textContent: p.when_text ? `planned: ${p.when_text}` : "" }), el("span", { className: "spacer" }), at),
    text, el("div", { className: "row" }, count, el("span", { className: "spacer" }), ask, save, approve), meta);
}

function drawCamp() {
  const c = open;
  $("#cHead").textContent = c.title;
  $("#cMeta").replaceChildren(el("span", { className: "pill " + c.status, textContent: STATUS_LABEL[c.status] || c.status }),
    ` ${c.approved}/${c.posts.length} posts approved · day 1 ${c.launch} · `, ...c.platforms.map(plat));
  $("#cTabs").replaceChildren(...[["posts", `Posts ${c.posts.length || ""}`], ["strategy", "Strategy"], ["source", "Brief"], ["agent", "Agent"]].map(([k, label]) => {
    const b = el("button", { className: tab === k ? "on" : "", textContent: label }); b.onclick = () => { tab = k; drawCamp(); }; return b; }));
  const body = $("#cBody"); body.replaceChildren();
  const run = c.runs[c.runs.length - 1];
  if (busy(c) && run) {
    const stop = el("button", { className: "small", textContent: "Stop" });
    stop.onclick = () => api("POST", `/api/campaigns/${c.id}/cancel`).catch(e => alert(e.message));
    body.append(el("div", { className: "working" },
      el("div", { className: "row" }, el("b", { textContent: run.status === "queued" ? "Starting the agent's sandbox…" : `The agent is ${c.status === "revising" ? "revising" : "drafting the campaign"}… ${fmtSecs(Date.now() / 1000 - run.created_at)}` }), el("span", { className: "spacer" }), stop),
      run.note ? el("div", { className: "note", textContent: "Your note: " + run.note }) : "",
      run.steps.length ? stepList(run.steps) : el("div", { className: "sub", textContent: "Its steps show here as it works. You can close this." })));
  }
  if (run && run.status !== "completed" && !busy(c) && run.error) body.append(el("div", { className: "working" }, el("b", { className: "err", textContent: "The agent's last run did not finish." }), el("div", { textContent: run.error })));
  if (tab === "posts") {
    if (!c.posts.length && !busy(c)) body.append(el("div", { className: "muted", textContent: "No posts yet." }));
    for (const p of c.posts) body.append(postCard(c, p));
  } else if (tab === "strategy") {
    const d = el("div", { className: "doc" }); d.innerHTML = window.marked ? marked.parse(c.strategy || "_No strategy yet._") : c.strategy; body.append(d);
  } else if (tab === "source") {
    body.append(el("div", { className: "sub", textContent: `Goal: ${c.goal || "—"} · Audience: ${c.audience || "—"}` }),
      el("div", { className: "sub", textContent: `Canonical URL: ${c.canonical_url || c.link || "—"}` }), el("div", { style: "height:10px" }),
      el("div", { style: "white-space:pre-wrap", textContent: c.source }));
  } else {
    body.append(el("p", { className: "sub", textContent: `Harness ${META.model}. One session for this campaign: ${c.session_id || "—"}; its files are under /workspace/campaigns/${c.slug}/.` }));
    for (const r of [...c.runs].reverse()) {
      const u = r.usage || {};
      const box = el("div", { className: "run" }, el("div", { className: "row" }, el("b", { textContent: r.kind === "plan" ? "Campaign plan" : "Revision" }),
        el("span", { className: "pill " + (r.status === "completed" ? "approved" : r.status === "failed" ? "failed" : ""), textContent: r.status }),
        el("span", { className: "sub", textContent: [r.ended_at && `took ${fmtSecs(r.ended_at - r.created_at)}`, u.total_tokens && `${u.total_tokens.toLocaleString()} tokens`, r.response_id].filter(Boolean).join(" · ") })));
      if (r.note) box.append(el("div", { className: "note", textContent: "Note: " + r.note }));
      if (r.answer) { const m = el("div", { className: "doc" }); m.innerHTML = window.marked ? marked.parse(r.answer) : r.answer; box.append(m); }
      if (r.error) box.append(el("div", { className: "err", textContent: r.error }));
      if (r.steps.length) box.append(stepList(r.steps));
      body.append(box);
    }
  }
  const foot = $("#cFoot"); foot.replaceChildren();
  if (busy(c)) { foot.append(el("div", { className: "sub", textContent: "The agent keeps working if you close this; the campaign updates when it finishes." })); return; }
  const note = el("textarea", { placeholder: "A note for the agent about the whole campaign: tone, timing, what to add or cut…", style: "min-height:52px" });
  const send = el("button", { textContent: "Send to the agent" });
  send.onclick = async () => { send.disabled = true; try { await api("POST", `/api/campaigns/${c.id}/revise`, { note: note.value }); openCamp(c.id); } catch (e) { alert(e.message); send.disabled = false; } };
  const all = el("button", { className: "ok", textContent: "Approve all", disabled: !c.posts.length || c.approved === c.posts.length });
  all.onclick = async () => { for (const p of c.posts.filter(p => p.status !== "approved")) { try { open = await api("PUT", `/api/posts/${p.id}`, { status: "approved" }); } catch (e) { alert(`${p.platform}: ${e.message}`); } } drawCamp(); load(); };
  const del = el("button", { className: "danger", textContent: "Delete" });
  del.onclick = async () => { if (confirm("Delete this campaign and its posts?")) { await api("DELETE", `/api/campaigns/${c.id}`); closePanels(); load(); } };
  foot.append(note, el("div", { className: "row" }, send, el("span", { className: "spacer" }), del, all));
}

(async function init() {
  META = await api("GET", "/api/meta");
  for (const [k, v] of Object.entries(META.platforms)) {
    $("#platFilter").append(el("option", { value: k, textContent: v.label }));
    $("#nPlatforms").append(el("label", {}, el("input", { type: "checkbox", value: k }), `${v.label} (${v.limit})`));
  }
  $("#nExamples").replaceChildren(...EXAMPLES.map(x => { const b = el("button", { className: "chip", textContent: x.title }); b.onclick = () => newCampaign(x); return b; }));
  $("#search").oninput = render; $("#platFilter").onchange = render;
  $("#listBtn").onclick = () => setView("list"); $("#calBtn").onclick = () => setView("calendar");
  $("#prevWk").onclick = () => { weekOffset--; renderCal(); }; $("#nextWk").onclick = () => { weekOffset++; renderCal(); }; $("#todayWk").onclick = () => { weekOffset = 0; renderCal(); };
  $("#newBtn").onclick = () => newCampaign(null); $("#createBtn").onclick = createCampaign;
  $("#brandBtn").onclick = openBrand; $("#saveBrandBtn").onclick = saveBrand;
  document.querySelectorAll(".drawer-bg, .closeBtn").forEach(b => b.onclick = closePanels);
  document.onkeydown = e => { if (e.key === "Escape") closePanels(); };
  await load();
  setInterval(() => { if (camps.some(busy)) load(); }, 5000);
})();
</script>
</body>
</html>
